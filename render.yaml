# Render Blueprint for Dual-Track Planner (Node runtime - Free tier compatible)
# Connect this repo to Render and it will auto-deploy

services:
  - type: web
    name: dual-track-planner
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
